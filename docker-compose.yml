services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: retailrag_etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./docker/milvus_redis/etcd_data:/etcd
    ports:
      - "2379:2379"
    command: ["etcd", "--data-dir=/etcd", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd:2379"]

  minio:
    image: quay.io/minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: retailrag_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    command: server /data --console-address ":9001"
    volumes:
      - ./docker/milvus_redis/minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: retailrag_milvus
    depends_on: [etcd, minio]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      ETCD_AUTO_COMPACTION_RETENTION: "0"
      MILVUS_LOG_LEVEL: info
    command: ["milvus", "run", "standalone"]
    volumes:
      - ./docker/milvus_redis/milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: retailrag_redis
    command: redis-server --appendonly yes
    volumes:
      - ./docker/milvus_redis/redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  mysql:
    image: mysql:8.0.43
    container_name: retailrag_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-retailrag}
      MYSQL_USER: ${MYSQL_USER:-retailrag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command: --local-infile=1
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
