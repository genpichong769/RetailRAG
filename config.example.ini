# Copy this file to config.ini. Keep config.ini local and never commit credentials.
[mysql]
host = localhost
port = 3307
user = retailrag
password = <set-locally>
database = retailrag

[redis]
host = localhost
port = 6379
password =
db = 0
faq_cache_ttl = 86400
faq_cache_namespace = retailrag:v1

[faq]
retrieval_mode = dense
match_threshold = 0.84
algorithm_version = dense-bgem3-v1

[milvus]
host = localhost
port = 19530
database_name = retailrag
collection_name = retailrag_v1

[llm]
model = qwen3.7-plus
dashscope_api_key = <set-locally>
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2
evidence_reranker_threshold = 0.020635
query_rewrite_enabled = true

[logger]
log_file = logs/app.log

[app]
valid_sources = ["membership", "promotion", "after_sales", "store_operation", "product", "equipment", "policy", "notice"]
customer_service_phone = 门店值班经理或内部服务台
