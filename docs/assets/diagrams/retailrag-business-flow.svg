<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1460" viewBox="0 0 1800 1460" role="img" aria-labelledby="title desc">
  <title id="title">RetailRAG 核心业务流程</title>
  <desc id="desc">从用户提问、问候和 FAQ 快路径，到通用问题直答或内部问题进入四种检索策略、混合检索、证据判断与流式生成的完整流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 38px 'Microsoft YaHei','Segoe UI',sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px 'Microsoft YaHei','Segoe UI',sans-serif; fill: #64748b; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 16; }
      .entry { fill: #e0f2fe; stroke: #0284c7; }
      .fast { fill: #ecfdf5; stroke: #059669; }
      .route { fill: #eef2ff; stroke: #4f46e5; }
      .retrieval { fill: #eff6ff; stroke: #2563eb; }
      .guard { fill: #fff7ed; stroke: #ea580c; }
      .llm { fill: #f5f3ff; stroke: #7c3aed; }
      .result { fill: #f0fdf4; stroke: #16a34a; }
      .refuse { fill: #fff1f2; stroke: #e11d48; }
      .decision { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .text { font: 600 18px 'Microsoft YaHei','Segoe UI',sans-serif; fill: #172033; text-anchor: middle; }
      .small { font: 400 15px 'Microsoft YaHei','Segoe UI',sans-serif; fill: #475569; text-anchor: middle; }
      .label { font: 600 15px 'Microsoft YaHei','Segoe UI',sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1460"/>
  <text class="title" x="900" y="58" text-anchor="middle">RetailRAG 核心业务流程</text>
  <text class="subtitle" x="900" y="92" text-anchor="middle">FAQ 快路径与证据约束 RAG 的双层问答链路</text>

  <rect class="node entry" x="55" y="140" width="190" height="76"/>
  <text class="text" x="150" y="174">用户提问</text>
  <text class="small" x="150" y="198">Web UI / HTTP / WS</text>

  <rect class="node entry" x="305" y="140" width="190" height="76"/>
  <text class="text" x="400" y="174">FastAPI</text>
  <text class="small" x="400" y="198">统一接口入口</text>

  <polygon class="decision" points="645,125 775,178 645,231 515,178"/>
  <text class="text" x="645" y="174">问候模板</text>
  <text class="small" x="645" y="197">是否命中？</text>

  <rect class="node fast" x="835" y="140" width="255" height="76"/>
  <text class="text" x="962" y="173">FAQ 快速匹配</text>
  <text class="small" x="962" y="198">Dense / BM25 + Complexity Gate</text>

  <polygon class="decision" points="1225,125 1355,178 1225,231 1095,178"/>
  <text class="text" x="1225" y="174">可靠命中？</text>

  <rect class="node fast" x="1430" y="140" width="300" height="76"/>
  <text class="text" x="1580" y="173">直接返回确定性答案</text>
  <text class="small" x="1580" y="198">问候或 FAQ，不调用生成模型</text>

  <path class="arrow" d="M245 178 H305"/>
  <path class="arrow" d="M495 178 H515"/>
  <path class="arrow" d="M775 178 H835"/>
  <text class="label" x="788" y="160">否</text>
  <path class="arrow" d="M1090 178 H1095"/>
  <path class="arrow" d="M1355 178 H1430"/>
  <text class="label" x="1375" y="160">是</text>
  <path class="arrow" d="M645 125 V108 H1580 V140"/>
  <text class="label" x="665" y="101">是</text>

  <rect class="node route" x="790" y="305" width="345" height="84"/>
  <text class="text" x="962" y="338">多轮 Query Rewrite</text>
  <text class="small" x="962" y="364">结合最近 3 轮生成独立检索问题</text>

  <polygon class="decision" points="962,435 1127,500 962,565 797,500"/>
  <text class="text" x="962" y="494">Query Classifier</text>
  <text class="small" x="962" y="518">BERT + 安全规则，对原问题路由</text>

  <path class="arrow" d="M1225 231 V270 H962 V305"/>
  <text class="label" x="1242" y="257">未命中</text>
  <path class="arrow" d="M962 389 V435"/>

  <rect class="node llm" x="180" y="630" width="330" height="92"/>
  <text class="text" x="345" y="667">通用问题直答</text>
  <text class="small" x="345" y="693">不检索企业知识库</text>
  <text class="small" x="345" y="713">原问题 + 会话历史 → Qwen</text>

  <rect class="node route" x="765" y="620" width="395" height="102"/>
  <text class="text" x="962" y="657">Strategy Selector</text>
  <text class="small" x="962" y="683">对改写后的检索问题选择策略</text>
  <text class="small" x="962" y="706">qwen3.7-plus，失败回退 Direct</text>

  <path class="arrow" d="M797 500 H345 V630"/>
  <text class="label" x="530" y="486">General</text>
  <path class="arrow" d="M1127 500 H1210 V590 H962 V620"/>
  <text class="label" x="1148" y="486">Internal</text>

  <rect class="node route" x="555" y="790" width="230" height="74"/>
  <text class="text" x="670" y="824">Direct</text>
  <text class="small" x="670" y="847">直接检索</text>
  <rect class="node route" x="815" y="790" width="230" height="74"/>
  <text class="text" x="930" y="824">HyDE</text>
  <text class="small" x="930" y="847">假设问题检索</text>
  <rect class="node route" x="1075" y="790" width="230" height="74"/>
  <text class="text" x="1190" y="824">SubQuery</text>
  <text class="small" x="1190" y="847">子查询检索</text>
  <rect class="node route" x="1335" y="790" width="230" height="74"/>
  <text class="text" x="1450" y="824">Backtracking</text>
  <text class="small" x="1450" y="847">回溯问题检索</text>

  <path class="arrow" d="M962 722 V755 H670 V790"/>
  <path class="arrow" d="M962 722 V790"/>
  <path class="arrow" d="M962 755 H1190 V790"/>
  <path class="arrow" d="M962 755 H1450 V790"/>

  <rect class="node retrieval" x="685" y="935" width="555" height="82"/>
  <text class="text" x="962" y="968">BGE-M3 Dense + Sparse</text>
  <text class="small" x="962" y="993">Milvus Hybrid Search · WeightedRanker (1.0 / 0.7)</text>
  <path class="arrow" d="M670 864 V900 H962 V935"/>
  <path class="arrow" d="M930 864 V935"/>
  <path class="arrow" d="M1190 864 V900 H962 V935"/>
  <path class="arrow" d="M1450 864 V900 H962 V935"/>

  <rect class="node retrieval" x="685" y="1055" width="555" height="82"/>
  <text class="text" x="962" y="1088">父块恢复、去重与版本过滤</text>
  <text class="small" x="962" y="1113">子块召回 → 父块上下文 · Active / Latest Version</text>
  <path class="arrow" d="M962 1017 V1055"/>

  <rect class="node retrieval" x="685" y="1175" width="555" height="82"/>
  <text class="text" x="962" y="1208">BGE Reranker + Dynamic M</text>
  <text class="small" x="962" y="1233">CrossEncoder 精排 · 简单题 2 块 / 复杂题最多 3 块</text>
  <path class="arrow" d="M962 1137 V1175"/>

  <polygon class="decision guard" points="962,1290 1127,1350 962,1410 797,1350"/>
  <text class="text" x="962" y="1345">Evidence Gate</text>
  <text class="small" x="962" y="1369">证据是否足以回答？</text>
  <path class="arrow" d="M962 1257 V1290"/>

  <rect class="node llm" x="180" y="1288" width="360" height="88"/>
  <text class="text" x="360" y="1323">Qwen 生成回答</text>
  <text class="small" x="360" y="1348">知识证据 + 历史 + 问题</text>
  <text class="small" x="360" y="1369">Partial 模式仅回答可确认部分</text>

  <rect class="node refuse" x="1265" y="1288" width="275" height="88"/>
  <text class="text" x="1402" y="1324">明确拒答</text>
  <text class="small" x="1402" y="1352">证据不足，不调用 LLM</text>

  <rect class="node result" x="1580" y="1288" width="175" height="88"/>
  <text class="text" x="1667" y="1323">返回用户</text>
  <text class="small" x="1667" y="1348">WebSocket</text>
  <text class="small" x="1667" y="1369">流式输出</text>

  <path class="arrow dashed" d="M345 722 V1245 H360 V1288"/>
  <path class="arrow" d="M797 1350 H540"/>
  <text class="label" x="610" y="1333">充分 / 部分</text>
  <path class="arrow" d="M1127 1350 H1265"/>
  <text class="label" x="1150" y="1333">不足</text>
  <path class="arrow" d="M360 1376 V1415 H1667 V1376"/>
  <path class="arrow" d="M1540 1332 H1580"/>

  <text class="small" x="900" y="1448">注：通用问题绕过企业知识检索；内部问题仅在 Evidence Gate 通过后调用生成模型。</text>
</svg>
