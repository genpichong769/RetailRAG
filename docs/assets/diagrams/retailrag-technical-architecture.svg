<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">RetailRAG 系统技术架构</title>
  <desc id="desc">展示 FastAPI 接口层、FAQ 服务、RAG 编排、检索与生成组件，以及 Docker 基础设施和本地模型。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 38px 'Microsoft YaHei','Segoe UI',sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px 'Microsoft YaHei','Segoe UI',sans-serif; fill: #64748b; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 20; }
      .zone-title { font: 700 18px 'Microsoft YaHei','Segoe UI',sans-serif; fill: #334155; }
      .node { fill: #ffffff; stroke-width: 2; rx: 16; }
      .access { fill: #e0f2fe; stroke: #0284c7; }
      .service { fill: #ecfdf5; stroke: #059669; }
      .orchestrate { fill: #eef2ff; stroke: #4f46e5; }
      .retrieve { fill: #eff6ff; stroke: #2563eb; }
      .generate { fill: #f5f3ff; stroke: #7c3aed; }
      .store { fill: #fff7ed; stroke: #ea580c; }
      .model { fill: #fefce8; stroke: #ca8a04; }
      .text { font: 600 18px 'Microsoft YaHei','Segoe UI',sans-serif; fill: #172033; text-anchor: middle; }
      .small { font: 400 15px 'Microsoft YaHei','Segoe UI',sans-serif; fill: #475569; text-anchor: middle; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1120"/>
  <text class="title" x="900" y="58" text-anchor="middle">RetailRAG 系统技术架构</text>
  <text class="subtitle" x="900" y="92" text-anchor="middle">接口、问答编排、检索模型与本地基础设施的职责边界</text>

  <rect class="zone" x="55" y="125" width="1690" height="170"/>
  <text class="zone-title" x="85" y="158">访问与接口层</text>
  <rect class="node access" x="115" y="185" width="250" height="76"/>
  <text class="text" x="240" y="218">静态 Web UI</text>
  <text class="small" x="240" y="243">HTML / CSS / JavaScript</text>
  <rect class="node access" x="475" y="185" width="310" height="76"/>
  <text class="text" x="630" y="218">FastAPI 接口层</text>
  <text class="small" x="630" y="243">HTTP · WebSocket · Pydantic</text>
  <rect class="node access" x="895" y="185" width="315" height="76"/>
  <text class="text" x="1052" y="218">会话与流式交互</text>
  <text class="small" x="1052" y="243">最近 5 轮 · start/token/end</text>
  <rect class="node access" x="1320" y="185" width="330" height="76"/>
  <text class="text" x="1485" y="218">IntegratedQASystem</text>
  <text class="small" x="1485" y="243">FAQ → RAG 统一入口</text>
  <path class="arrow" d="M365 223 H475"/>
  <path class="arrow" d="M785 223 H895"/>
  <path class="arrow" d="M1210 223 H1320"/>

  <rect class="zone" x="55" y="330" width="1690" height="300"/>
  <text class="zone-title" x="85" y="363">应用与 RAG 编排层</text>
  <rect class="node service" x="95" y="410" width="285" height="138"/>
  <text class="text" x="237" y="444">FAQ Service</text>
  <text class="small" x="237" y="475">Dense / BM25 匹配</text>
  <text class="small" x="237" y="499">Complexity Gate</text>
  <text class="small" x="237" y="523">版本化答案缓存</text>

  <rect class="node orchestrate" x="445" y="392" width="330" height="174"/>
  <text class="text" x="610" y="426">查询决策</text>
  <text class="small" x="610" y="458">BERT Query Classifier</text>
  <text class="small" x="610" y="482">Multi-turn Query Rewrite</text>
  <text class="small" x="610" y="506">Strategy Selector</text>
  <text class="small" x="610" y="530">Direct / HyDE / SubQuery / Backtracking</text>

  <rect class="node retrieve" x="840" y="382" width="400" height="194"/>
  <text class="text" x="1040" y="416">检索与上下文构建</text>
  <text class="small" x="1040" y="448">BGE-M3 Dense + Sparse</text>
  <text class="small" x="1040" y="472">Milvus Weighted Hybrid Search</text>
  <text class="small" x="1040" y="496">父块恢复、去重与版本过滤</text>
  <text class="small" x="1040" y="520">BGE Reranker + Dynamic M</text>
  <text class="small" x="1040" y="544">Top 2 / 复杂问题最多 Top 3</text>

  <rect class="node generate" x="1305" y="410" width="350" height="138"/>
  <text class="text" x="1480" y="444">证据约束生成</text>
  <text class="small" x="1480" y="475">Evidence Gate</text>
  <text class="small" x="1480" y="499">Answer / Partial / Refuse</text>
  <text class="small" x="1480" y="523">Qwen 流式生成</text>

  <path class="arrow" d="M380 479 H445"/>
  <path class="arrow" d="M775 479 H840"/>
  <path class="arrow" d="M1240 479 H1305"/>
  <path class="arrow dash" d="M1485 261 V330 H237 V410"/>
  <path class="arrow dash" d="M1485 261 V410"/>

  <rect class="zone" x="55" y="665" width="1030" height="390"/>
  <text class="zone-title" x="85" y="698">Docker Compose 基础设施</text>
  <rect class="node store" x="110" y="755" width="250" height="90"/>
  <text class="text" x="235" y="792">MySQL 8</text>
  <text class="small" x="235" y="819">200 FAQ · 会话历史</text>
  <rect class="node store" x="415" y="755" width="250" height="90"/>
  <text class="text" x="540" y="792">Redis 7</text>
  <text class="small" x="540" y="819">FAQ 索引与答案缓存</text>
  <rect class="node store" x="720" y="755" width="300" height="90"/>
  <text class="text" x="870" y="792">Milvus 2.4</text>
  <text class="small" x="870" y="819">Dense / Sparse 向量与元数据</text>
  <rect class="node store" x="245" y="915" width="250" height="90"/>
  <text class="text" x="370" y="952">etcd</text>
  <text class="small" x="370" y="979">Milvus 元数据</text>
  <rect class="node store" x="585" y="915" width="250" height="90"/>
  <text class="text" x="710" y="952">MinIO</text>
  <text class="small" x="710" y="979">Milvus 对象存储</text>

  <rect class="zone" x="1125" y="665" width="620" height="390"/>
  <text class="zone-title" x="1155" y="698">模型与推理</text>
  <rect class="node model" x="1175" y="755" width="245" height="90"/>
  <text class="text" x="1297" y="792">BGE-M3</text>
  <text class="small" x="1297" y="819">Dense + Sparse Embedding</text>
  <rect class="node model" x="1450" y="755" width="245" height="90"/>
  <text class="text" x="1572" y="792">BGE Reranker</text>
  <text class="small" x="1572" y="819">CrossEncoder 精排</text>
  <rect class="node model" x="1175" y="915" width="245" height="90"/>
  <text class="text" x="1297" y="952">Retail BERT</text>
  <text class="small" x="1297" y="979">Internal / General 分类</text>
  <rect class="node generate" x="1450" y="915" width="245" height="90"/>
  <text class="text" x="1572" y="952">qwen3.7-plus</text>
  <text class="small" x="1572" y="979">DashScope API</text>

  <path class="arrow dash" d="M237 548 V700 H235 V755"/>
  <path class="arrow dash" d="M237 548 V700 H540 V755"/>
  <path class="arrow dash" d="M1040 576 V700 H870 V755"/>
  <path class="arrow dash" d="M870 845 V880 H370 V915"/>
  <path class="arrow dash" d="M870 845 V880 H710 V915"/>
  <path class="arrow dash" d="M1040 576 V720 H1297 V755"/>
  <path class="arrow dash" d="M1040 576 V720 H1572 V755"/>
  <path class="arrow dash" d="M610 566 V880 H1297 V915"/>
  <path class="arrow dash" d="M610 566 V860 H1572 V915"/>
  <path class="arrow dash" d="M1480 548 V880 H1572 V915"/>

  <text class="small" x="900" y="1092">本地模型与 Docker 服务均可独立替换；Qwen 通过 DashScope OpenAI-compatible API 调用。</text>
</svg>
